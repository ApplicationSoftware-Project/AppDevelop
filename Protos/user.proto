syntax = "proto3";

option csharp_namespace = "App.Features.Auth.Grpc";

package auth;

// Auth 서비스가 노출하는 사용자 조회/검증 gRPC 서비스
// Receipt, Analysis 서비스가 클라이언트로 사용
service UserService {
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  rpc CheckUserExists (CheckUserExistsRequest) returns (CheckUserExistsResponse);
}

// ── GetUser ───────────────────────────────────────────
message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  bool found        = 1;
  string user_id    = 2;
  string email      = 3;
  string display_name = 4;
  string role       = 5;
}

// ── CheckUserExists ───────────────────────────────────
message CheckUserExistsRequest {
  string user_id = 1;
}

message CheckUserExistsResponse {
  bool exists = 1;
  string role = 2;
}
