services:
  postgres:
    image: postgres:16
    container_name: receipt-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ReceiptManager}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Dev@Password123!}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ReceiptManager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
