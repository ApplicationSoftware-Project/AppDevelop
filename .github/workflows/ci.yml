name: CI

on:
  push:
    branches:
      - master
      - feat/**
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore App.sln

      - name: Build
        run: dotnet build App.sln --configuration Release --no-restore

      - name: Publish (publishability verification)
        run: dotnet publish App.csproj --configuration Release --no-restore --output ./publish
