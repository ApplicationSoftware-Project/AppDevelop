name: CI

on:
  push:
    branches:
      - master
      - feat/**
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore App.sln
        working-directory: App

      - name: Build
        run: dotnet build App.sln --configuration Release --no-restore
        working-directory: App
